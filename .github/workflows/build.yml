name: 构建安装包

# 推送 main 分支 / 打 v 开头 tag / 手动触发时，自动构建 macOS 和 Windows 安装包。
# 普通推送：安装包作为本次运行的 artifacts 可下载。
# 打 tag（如 v0.1.0）：额外发布一个 GitHub Release（草稿），安装包挂到 Release 资产。
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS：通用包（Intel + Apple Silicon 都能装）
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          # Windows：NSIS 安装包
          - platform: windows-latest
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装前端依赖
        run: npm ci

      - name: 构建安装包
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 配置了这些密钥才会签名/公证，没配则跳过（本地安装不受影响）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: ${{ matrix.args }}
          # 只有打 tag 才创建 GitHub Release；普通推送只构建并上传 workflow artifacts
          tagName: "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}"
          releaseName: "熊猫投稿 ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}"
          releaseBody: '自动构建的安装包：macOS 下载 .dmg，Windows 下载 .exe。'
          releaseDraft: true
          uploadWorkflowArtifacts: true
