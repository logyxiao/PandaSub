name: 构建安装包

# 打 v 开头 tag / 手动触发时，自动构建 macOS 和 Windows 安装包。
# 打 tag（如 v0.1.2）：把 tag 写入应用版本后再构建，并发布 GitHub Release（草稿）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS：通用包（Intel + Apple Silicon 都能装）
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          # Windows：NSIS 安装包
          - platform: windows-latest
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装前端依赖
        run: npm ci

      - name: 按 Git tag 写入应用版本
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION#V}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "tag $GITHUB_REF_NAME 不是有效的版本号（期望 v0.1.2 这种形式）"
            exit 1
          fi
          echo "安装包版本: $VERSION"
          VERSION="$VERSION" node <<'EOF'
          const fs = require('fs')
          const version = process.env.VERSION
          const writeJson = (path) => {
            const json = JSON.parse(fs.readFileSync(path, 'utf8'))
            json.version = version
            fs.writeFileSync(path, JSON.stringify(json, null, 2) + '\n')
          }
          writeJson('src-tauri/tauri.conf.json')
          writeJson('package.json')
          const cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8')
            .replace(/^version = ".*"$/m, `version = "${version}"`)
          fs.writeFileSync('src-tauri/Cargo.toml', cargo)
          EOF

      - name: 构建安装包
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          # 只有打 tag 才创建 GitHub Release；普通推送只构建并上传 workflow artifacts
          tagName: "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}"
          releaseName: "熊猫投稿 ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}"
          releaseBody: '自动构建的安装包：macOS 下载 .dmg，Windows 下载 .exe。'
          releaseDraft: true
          uploadWorkflowArtifacts: true
